[package]
name = "smbx"
version = "1.0.0"
license = "MIT"
description = "Lightweight dual-pane SMB file manager for macOS and Windows"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
async-trait = "0.1"
smb2 = "=0.20.1"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
